name: Enzyme [Downstream CI]

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  binary_test:
    name: Enzyme Julia ${{ matrix.version }} ${{ matrix.llvm_args }} - ${{ matrix.os }} - ${{ matrix.arch }} , assertions ${{ matrix.assertions }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10']
        os: ['ubuntu-latest']
        assertions:
          - false
          - true
        arch: [x64]
        llvm_args: ['']
        include:
          # starting with Julia 1.10, we can enable opaque pointers
          - version: '1.10'
            os: 'ubuntu-latest'
            arch: 'x64'
            llvm_args: '--opaque-pointers'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # build_ci.jl needs to be able to inspect the git log
      - name: Clone Downstream
        uses: actions/checkout@v7
        with:
          repository: EnzymeAD/Enzyme.jl
          path: downstream

      # install Julia
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      # check that Enzyme can be installed with this version of LLVM.jl. when it can't,
      # this is a breaking release that Enzyme doesn't support yet, which is fine, so skip
      # the remainder of the job.
      - name: Install Enzyme with this version of LLVM.jl
        id: install
        shell: julia --color=yes --project=downstream {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0
        run: |
          using Pkg
          installable = try
            Pkg.develop(PackageSpec(path="."))
            Pkg.update()
            true
          catch err
            err isa Pkg.Resolve.ResolverError || rethrow()
            @info "Enzyme is not compatible with this version of LLVM.jl, skipping its tests" exception=err
            false
          end
          open(ENV["GITHUB_OUTPUT"], "a") do io
            println(io, "installable=$installable")
          end

      - uses: julia-actions/julia-buildpkg@latest
        if: steps.install.outputs.installable == 'true'
      - name: Build libLLVMExtra
        if: steps.install.outputs.installable == 'true'
        run: julia --project=deps deps/build_ci.jl
      - name: Propagate libLLVMExtra preference to downstream
        if: steps.install.outputs.installable == 'true'
        run: |
          if [ -f LocalPreferences.toml ]; then
            cp LocalPreferences.toml downstream/LocalPreferences.toml
          fi
      - name: Run the Enzyme tests
        if: steps.install.outputs.installable == 'true'
        shell: julia --color=yes --project=downstream {0}
        run: |
          using Pkg
          Pkg.test(; coverage=true, julia_args=`--depwarn=no`)
