name: Test

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  binary_test:
    name: Julia ${{ matrix.version }} ${{ matrix.llvm_args }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # nightly jobs on Windows and macOS take 12-15 minutes, mostly precompiling for a
    # new nightly and saving the depot cache; the test step has its own timeout to catch hangs
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12', '1.13', 'nightly']
        os: ['ubuntu-latest', 'ubuntu-24.04-arm', 'macOS-latest', 'windows-latest']
        llvm_args: ['', '--opaque-pointers']
        exclude:
          # opaque pointers are the default from Julia 1.12 on
          - version: '1.12'
            llvm_args: '--opaque-pointers'
          - version: '1.13'
            llvm_args: '--opaque-pointers'
          - version: 'nightly'
            llvm_args: '--opaque-pointers'
          # pull requests only test the non-default opaque pointers on x86_64 Linux
          - llvm_args: ${{ github.event_name == 'pull_request' && '--opaque-pointers' || 'none' }}
            os: 'ubuntu-24.04-arm'
          - llvm_args: ${{ github.event_name == 'pull_request' && '--opaque-pointers' || 'none' }}
            os: 'macOS-latest'
          - llvm_args: ${{ github.event_name == 'pull_request' && '--opaque-pointers' || 'none' }}
            os: 'windows-latest'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # build_ci.jl needs to be able to inspect the git log

      # install Julia
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}

      # set-up packages
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
        if: runner.os == 'Windows'

      - name: Build libLLVMExtra
        run: julia --project=deps deps/build_ci.jl
        if: runner.os != 'Windows'
      - name: Build libLLVMExtra (in msys2)
        shell: msys2 {0}
        run: julia --project=deps deps/build_ci.jl
        if: runner.os == 'Windows'

      - name: Run tests
        timeout-minutes: 20
        run: |
          julia -e 'open("LocalPreferences.toml", "a") do io
                      println(io, "typecheck = \"true\"")
                      println(io, "memcheck = \"true\"")
                    end'
          julia --project -e 'using Pkg; Pkg.test(; coverage=true)'
        env:
          JULIA_LLVM_ARGS: ${{ matrix.llvm_args }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          file: lcov.info

  standalone:
    # build standalone LLVM libraries from every version of LLVM_full_jll, check that they
    # work next to Julia's own LLVM, and run the tests with LLVM.jl using them
    name: Julia 1.12 with LLVM ${{ matrix.llvm }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        llvm: ['15', '16', '17', '18', '19', '20', '21', '22', '23']
        os: ['ubuntu-latest', 'macOS-latest']
        # pull requests only build the oldest and newest version on macOS
        exclude: >-
          ${{ fromJSON(github.event_name == 'pull_request' &&
                       '[{"os": "macOS-latest", "llvm": "16"}, {"os": "macOS-latest", "llvm": "17"},
                         {"os": "macOS-latest", "llvm": "18"}, {"os": "macOS-latest", "llvm": "19"},
                         {"os": "macOS-latest", "llvm": "20"}, {"os": "macOS-latest", "llvm": "21"},
                         {"os": "macOS-latest", "llvm": "22"}]' || '[]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # build_ci.jl needs to be able to inspect the git log
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
        with:
          # every job downloads another version of LLVM_full_jll, which is too large to cache
          cache-artifacts: 'false'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Build libLLVMExtra
        run: julia --project=deps deps/build_ci.jl
      - name: Build the standalone library
        run: |
          julia --project=deps deps/build_standalone.jl ${{ matrix.llvm }} "$RUNNER_TEMP/standalone" | tee build.log
          echo "STANDALONE_LIBRARY=$(tail -n 1 build.log)" >> "$GITHUB_ENV"
      - name: Test the standalone library
        run: |
          julia --project=test -e 'using Pkg; Pkg.instantiate()'
          julia --project=test test/standalone/runtests.jl "$STANDALONE_LIBRARY"
      - name: Run tests using the standalone library
        timeout-minutes: 20
        run: |
          julia -e 'open("LocalPreferences.toml", "a") do io
                      println(io, "libLLVM = \"$(ENV["STANDALONE_LIBRARY"])\"")
                    end'
          julia --project -e 'using Pkg; Pkg.test()'

  mixed:
    # run the tests with a standalone library next to Julia's own LLVM, of another version,
    # which LLVM.jl was not compiled for
    name: Julia ${{ matrix.julia }} next to LLVM ${{ matrix.llvm }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - julia: '1.10'  # LLVM 15
            llvm: '23'
          - julia: '1.12'  # LLVM 18
            llvm: '23'
          - julia: '1.12'
            llvm: '16'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # build_ci.jl needs to be able to inspect the git log
      # the library is built using Julia 1.12, like in the standalone job, from a copy of
      # deps/ so that its environment doesn't affect the one of the Julia version under test
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Build the standalone library
        run: |
          cp -r deps "$RUNNER_TEMP/deps"
          julia "$RUNNER_TEMP/deps/build_standalone.jl" ${{ matrix.llvm }} "$RUNNER_TEMP/standalone" | tee build.log
          echo "LLVM_TEST_LIBRARY=$(tail -n 1 build.log)" >> "$GITHUB_ENV"
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
        with:
          cache-artifacts: 'false'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Build libLLVMExtra
        run: julia --project=deps deps/build_ci.jl
      - name: Run tests
        timeout-minutes: 20
        run: julia --project -e 'using Pkg; Pkg.test()'

  trim:
    # check that applications that depend on LLVM.jl can be compiled into trimmed executables
    # (see test/trim), which do not include Julia's LLVM
    name: Trimming - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1.13', 'nightly']
        os: ['ubuntu-latest', 'macOS-latest']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Install JuliaC
        run: julia --project="$RUNNER_TEMP/juliac" -e 'using Pkg; Pkg.add("JuliaC")'
      - name: Build the executable
        run: |
          julia --project="$RUNNER_TEMP/juliac" -e 'using JuliaC; JuliaC.main(ARGS)' -- \
            --output-exe trimtest --bundle "$RUNNER_TEMP/build" --trim=safe --experimental \
            test/trim
      - name: Run the executable
        run: "$RUNNER_TEMP/build/bin/trimtest"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # Documenter deploys with the DOCUMENTER_KEY deploy key
    permissions:
      contents: read
      statuses: write   # report the deployed preview on pull requests
      pull-requests: write  # link the preview from pull requests that change the docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # build_ci.jl needs to be able to inspect the git log
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Build libLLVMExtra
        run: julia --project=deps deps/build_ci.jl
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ docs/make.jl

      # Documenter only reports the preview as a commit status, which is easy to miss, so
      # link it from pull requests that change the documentation. Pull requests from forks
      # don't get a preview.
      - name: Link the preview
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const files = await github.paginate(github.rest.pulls.listFiles,
                                                {owner, repo, pull_number: issue_number, per_page: 100});
            if (!files.some(file => file.filename.startsWith('docs/'))) {
              return;
            }
            const marker = '<!-- documentation-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments,
                                                   {owner, repo, issue_number, per_page: 100});
            if (comments.some(comment => comment.body?.startsWith(marker))) {
              return;
            }
            const url = `https://juliallvm.github.io/LLVM.jl/previews/PR${issue_number}/`;
            await github.rest.issues.createComment({owner, repo, issue_number,
                                                   body: `${marker}\nDocumentation preview: ${url}`});
