name: TestAsserts

# This workflow runs tests using assert builds downloaded by GetAsserts.
# It does not use any secrets (BUILDKITE_TOKEN access is confined to GetAsserts).

on:
  workflow_run:
    workflows: ["GetAsserts"]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  report-start:
    name: Report Julia ${{ matrix.version }} ${{ matrix.llvm_args }} (assert) start
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      checks: write
    strategy:
      fail-fast: false
      matrix:
        version: ['1.11', '1.12', '1.13', 'master']
        llvm_args: ['']
        include:
          # on Julia 1.11, also test non-default opaque pointers
          - version: '1.11'
            llvm_args: '--opaque-pointers'
    steps:
      - name: Report in-progress
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: '${{ github.event.workflow_run.head_sha }}',
              name: 'Julia ${{ matrix.version }} ${{ matrix.llvm_args }} (assert) - Linux',
              status: 'in_progress',
              details_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  test:
    name: Julia ${{ matrix.version }} ${{ matrix.llvm_args }} (assert) - Linux
    needs: report-start
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['1.11', '1.12', '1.13', 'master']
        llvm_args: ['']
        include:
          # on Julia 1.11, also test non-default opaque pointers
          - version: '1.11'
            llvm_args: '--opaque-pointers'
    steps:

      - name: Download Julia build
        uses: actions/download-artifact@v8
        with:
          name: julia-${{ matrix.version }}-x86_64-linux-gnuassert
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Install Julia
        run: |
          tar -xf julia.tar.gz -C ../
          rm julia.tar.gz
          echo $PWD/../julia-*/bin >> $GITHUB_PATH

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # GetAsserts only runs trusted base-branch code. This job intentionally tests the
          # resulting artifact against the triggering revision without exposing credentials.
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      # set-up packages
      - uses: julia-actions/julia-buildpkg@v1

      - name: Build libLLVMExtra
        run: julia --project=deps deps/build_ci.jl

      - name: Run tests
        run: |
          julia -e 'open("LocalPreferences.toml", "a") do io
                      println(io, "typecheck = \"true\"")
                      println(io, "memcheck = \"true\"")
                    end'
          julia --project -e 'using Pkg; Pkg.test(; coverage=true)'
        env:
          JULIA_LLVM_ARGS: ${{ matrix.llvm_args }}

  report-result:
    name: Report Julia ${{ matrix.version }} ${{ matrix.llvm_args }} (assert) result
    needs: test
    if: always() && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        version: ['1.11', '1.12', '1.13', 'master']
        llvm_args: ['']
        include:
          # on Julia 1.11, also test non-default opaque pointers
          - version: '1.11'
            llvm_args: '--opaque-pointers'
    steps:
      - name: Report check run
        uses: actions/github-script@v9
        env:
          TEST_JOB: Julia ${{ matrix.version }} ${{ matrix.llvm_args }} (assert) - Linux
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
              per_page: 100,
            });
            const job = jobs.find(({name}) => name === process.env.TEST_JOB);
            const conclusion = job?.conclusion || 'failure';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: '${{ github.event.workflow_run.head_sha }}',
              name: 'Julia ${{ matrix.version }} ${{ matrix.llvm_args }} (assert) - Linux',
              status: 'completed',
              conclusion,
              details_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: `Assert build test ${conclusion}`,
                summary: 'Tested against `x86_64-linux-gnuassert` build of Julia ${{ matrix.version }}.'
              }
            });

  report-failure:
    name: Report download failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    permissions:
      checks: write
    steps:
      - name: Report check runs
        uses: actions/github-script@v9
        with:
          script: |
            // Keep in sync with the matrix above
            const entries = [
              {version: 'master', llvm_args: ''},
              {version: '1.11', llvm_args: '--opaque-pointers'},
              {version: '1.11', llvm_args: ''},
              {version: '1.12', llvm_args: ''},
              {version: '1.13', llvm_args: ''},
            ];
            await Promise.all(entries.map(({version, llvm_args}) =>
              github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: '${{ github.event.workflow_run.head_sha }}',
                name: `Julia ${version} ${llvm_args} (assert) - Linux`,
                status: 'completed',
                conclusion: 'failure',
                details_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ github.event.workflow_run.id }}`,
                output: {
                  title: 'Assert build download failed',
                  summary: 'The GetAsserts workflow failed to download the Julia build.'
                }
              })
            ));
